function allowed(p){let r=el('role').value;if(r==='Admin')return true;if(r==='Kasir')return !['pengguna','karyawan','kinerja'].includes(p);return ['dashboard','owner','hewan','layanan','fasilitas','booking','riwayat'].includes(p)}function canEdit(p){return el('role').value==='Admin'||(el('role').value==='Kasir'&&['owner','hewan','booking'].includes(p))}function nav(){let groups=[['MENU UTAMA',['dashboard']],['MASTER DATA',['pengguna','owner','hewan','karyawan','layanan','fasilitas']],['TRANSAKSI',['booking','pembayaran']],['LAPORAN',['pendapatan','riwayat','kinerja','nota']]];el('nav').innerHTML=groups.map(([g,ps])=>'<h5>'+g+'</h5>'+ps.filter(allowed).map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span class="ico">${pages[p][1]}</span>${pages[p][0]}</button>`).join('')).join('')+'<h5>LAINNYA</h5><button onclick="resetDemo()"><span class="ico">↻</span>Reset data demo</button>'}
function go(p){if(!allowed(p))return;page=p;el('side').classList.remove('show');el('crumb').textContent=pages[p][0];nav();render()}el('role').onchange=()=>{el('avatar').textContent=el('role').value[0];if(!allowed(page))page='dashboard';go(page)};
function status(s){let c= /Menunggu/.test(s)?'wait':/Proses/.test(s)?'work':/Batal/.test(s)?'cancel':'';return `<span class="status ${c}">${esc(s)}</span>`}function welcome(title,desc,action=''){return `<div class="welcome"><div><div class="eyebrow">Pawppy Jakarta / Operasional</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">Belum ada data yang cocok.</td></tr>`}</tbody></table></div>`}function actions(p,i){return `<button class="mini" onclick="detail('${p}',${i})">Detail</button>`+(canEdit(p)?`<button class="mini" onclick="form('${p}',${i})">Ubah</button>`:'')}
function dashboard(){let active=data.booking.filter(x=>!['Selesai','Dibatalkan'].includes(x[6])).length, rev=data.nota.reduce((n,x)=>n+Number(x[5]),0);return welcome('Selamat datang kembali 👋','Pantau aktivitas operasional Pawppy Jakarta dalam satu tempat.',`<button class="btn" onclick="go('booking')">+ &nbsp; Lihat booking</button>`)+`<div class="cards"><div class="card"><div class="cardtop">Booking aktif <span class="bubble">▣</span></div><div class="metric">${active}</div><div class="hint">Menunggu hingga dalam proses</div></div><div class="card"><div class="cardtop">Hewan terdaftar <span class="bubble">♡</span></div><div class="metric">${data.hewan.length}</div><div class="hint">Data hewan dalam demo</div></div><div class="card"><div class="cardtop">Owner terdaftar <span class="bubble">♧</span></div><div class="metric">${data.owner.length}</div><div class="hint">Data pelanggan dalam demo</div></div><div class="card"><div class="cardtop">Total pembayaran <span class="bubble">↗</span></div><div class="metric">${el('role').value==='Staf'?'—':money(rev)}</div><div class="hint">Akumulasi nota contoh</div></div></div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Booking terbaru</h2><p class="sub">Daftar layanan yang perlu diperhatikan</p></div><button class="link" onclick="go('booking')">Lihat semua →</button></div>${table(['ID Booking','Hewan / Owner','Layanan','Jadwal','Status'],data.booking.slice(0,5).map(x=>[`<strong>${esc(x[0])}</strong>`,`<strong>${esc(x[1])}</strong><br><span class="hint">${esc(x[2])}</span>`,esc(x[3]),esc(x[4])+'<br><span class="hint">'+esc(x[5])+'</span>',status(x[6])]))}</section><div><section class="panel"><div class="panelhead"><div><h2>Ringkasan operasional</h2><p class="sub">Gambaran data contoh</p></div><span class="tag">Demo</span></div><div class="summaryrow"><div class="summaryicon">◷</div><div class="summarytext"><b>Menunggu konfirmasi</b><small>Periksa jadwal booking</small></div><b>${data.booking.filter(x=>x[6]==='Menunggu').length}</b></div><div class="summaryrow"><div class="summaryicon">✧</div><div class="summarytext"><b>Dalam proses</b><small>Layanan yang sedang berjalan</small></div><b>${data.booking.filter(x=>x[6]==='Dalam Proses').length}</b></div><div class="summaryrow"><div class="summaryicon">▦</div><div class="summarytext"><b>Fasilitas tersedia</b><small>Siap digunakan</small></div><b>${data.fasilitas.filter(x=>x[3]==='Tersedia').length}</b></div></section><section class="panel" style="margin-top:18px"><h2>Akses cepat</h2><p class="sub">Mulai pekerjaan lebih mudah</p><div class="quick"><button onclick="go('booking')">▣ &nbsp; Booking layanan →</button><button onclick="go('hewan')">♡ &nbsp; Data hewan →</button>${allowed('nota')?'<button onclick="go(\'nota\')">▧ &nbsp; Cek nota →</button>':''}${allowed('pembayaran')?'<button onclick="go(\'pembayaran\')">▤ &nbsp; Pembayaran →</button>':''}</div></section></div></div><div class="note">✦ &nbsp; <b>Ini adalah demo interaktif.</b> Seluruh data adalah contoh dan disimpan sementara di browser ini; belum terhubung ke MySQL atau aplikasi desktop.</div>`}
function master(p){let c=config[p];return welcome(c.headers[1]==='Nama Hewan'?'Data Hewan':pages[p][0],'Kelola dan lihat data '+pages[p][0].toLowerCase()+'.',canEdit(p)?`<button class="btn" onclick="form('${p}')">+ &nbsp; Tambah data</button>`:'<span class="tag">Akses lihat saja</span>')+`<section class="panel pagepanel"><div class="panelhead"><div><h2>Daftar ${pages[p][0]}</h2><p class="sub">${data[p].length} data tersimpan dalam demo</p></div><input class="search" placeholder="Cari data..." oninput="filterTable(this)"></div>${table([...c.headers,'Aksi'],data[p].map((x,i)=>[...x.map((v,j)=>p==='layanan'&&j===3?money(v):esc(v)),actions(p,i)]))}</section><div class="note">Perubahan hanya berlaku pada data contoh di browser ini.</div>`}
function booking(){return welcome('Booking Layanan','Pantau jadwal dan proses perawatan hewan.',canEdit('booking')?'<button class="btn" onclick="bookingForm()">+ &nbsp; Booking baru</button>':'')+`<section class="panel pagepanel"><div class="panelhead"><div><h2>Daftar booking</h2><p class="sub">Pilih detail untuk melihat atau memperbarui status.</p></div><input class="search" placeholder="Cari booking atau hewan..." oninput="filterTable(this)"></div>${table(['ID','Hewan','Owner','Layanan','Tanggal','Sesi','Status','Aksi'],data.booking.map((x,i)=>[...x.slice(0,6).map(esc),status(x[6]),`<button class="mini" onclick="bookingDetail(${i})">Detail</button>`]))}</section>`}
function pembayaran(){let pending=data.booking.map((x,i)=>({x,i})).filter(o=>!['Selesai','Dibatalkan'].includes(o.x[6]));return welcome('Check-Out & Pembayaran','Pilih booking untuk mensimulasikan pembayaran.')+`<section class="panel pagepanel"><div class="panelhead"><div><h2>Booking menunggu check-out</h2><p class="sub">Pembayaran di bawah ini hanya simulasi.</p></div><input class="search" placeholder="Cari booking..." oninput="filterTable(this)"></div>${table(['ID Booking','Hewan','Owner','Layanan','Tagihan','Status','Aksi'],pending.map(({x,i})=>[esc(x[0]),esc(x[1]),esc(x[2]),esc(x[3]),money(x[7]),status(x[6]),`<button class="mini" onclick="checkout(${i})">Check-out</button>`]))}</section>`}
function nota(){return welcome('Cek Nota','Cari dan lihat kembali transaksi yang telah dibayar.')+`<section class="panel pagepanel"><div class="panelhead"><div><h2>Daftar nota pembayaran</h2><p class="sub">Cari berdasarkan nomor nota, owner, hewan, atau tanggal.</p></div><input class="search" placeholder="Cari nota..." oninput="filterTable(this)"></div>${table(['No. Nota','Tanggal','Owner','Hewan','Total','Metode','Aksi'],data.nota.map((x,i)=>[esc(x[0]),esc(x[4]),esc(x[2]),esc(x[1]),money(x[5]),esc(x[6]),`<button class="mini" onclick="notaDetail(${i})">Lihat nota</button>`]))}</section>`}
function report(p){let title=pages[p][0],rows,headers;if(p==='pendapatan'){headers=['No. Nota','Tanggal','Owner','Metode','Pendapatan'];rows=data.nota.map(x=>[esc(x[0]),esc(x[4]),esc(x[2]),esc(x[6]),money(x[5])])}else if(p==='riwayat'){headers=['Hewan','Owner','Layanan','Tanggal','Status'];rows=data.booking.map(x=>[esc(x[1]),esc(x[2]),esc(x[3]),esc(x[4]),status(x[6])])}else{headers=['Karyawan','Jabatan','Status'];rows=data.karyawan.map(x=>[esc(x[1]),esc(x[2]),esc(x[3])])}return welcome(title,'Contoh tampilan laporan untuk ditinjau.')+`<div class="reportcards"><div class="card"><div class="cardtop">Total data</div><div class="metric">${rows.length}</div><div class="hint">Berdasarkan data contoh</div></div>${p==='pendapatan'?`<div class="card"><div class="cardtop">Total pendapatan</div><div class="metric">${money(data.nota.reduce((n,x)=>n+Number(x[5]),0))}</div><div class="hint">Total seluruh nota contoh</div></div>`:''}</div><section class="panel pagepanel"><div class="panelhead"><div><h2>${title}</h2><p class="sub">Cari data pada laporan.</p></div><div class="toolbar"><input class="search" placeholder="Cari data..." oninput="filterTable(this)"><button class="btn light" onclick="window.print()">Cetak</button></div></div>${table(headers,rows)}</section>`+(p==='kinerja'?'<div class="note">Contoh ini baru menampilkan daftar karyawan. Jumlah layanan per staf memerlukan data penugasan groomer pada transaksi.</div>':'')}
function render(){el('content').innerHTML=page==='dashboard'?dashboard():config[page]?master(page):page==='booking'?booking():page==='pembayaran'?pembayaran():page==='nota'?nota():report(page)}function filterTable(input){const q=input.value.toLowerCase();input.closest('section').querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function modal(html){el('modal').innerHTML=html;el('modalbg').classList.add('open')}function closeModal(){el('modalbg').classList.remove('open')}function details(rows){return '<div class="detail">'+rows.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')+'</div>'}function detail(p,i){let c=config[p],x=data[p][i];modal(`<h2>Detail ${pages[p][0]}</h2><p>Informasi data contoh.</p>${details(c.labels.map((k,j)=>[k,p==='layanan'&&j===3?money(x[j]):x[j]]))}<div class="actions">${canEdit(p)?`<button class="btn light" onclick="closeModal();form('${p}',${i})">Ubah</button><button class="btn light" onclick="removeItem('${p}',${i})">Hapus</button>`:''}<button class="btn" onclick="closeModal()">Tutup</button></div>`)}function removeItem(p,i){if(!canEdit(p))return;if(confirm('Hapus data contoh ini?')){data[p].splice(i,1);save();closeModal();render()}}
function form(p,i){if(!canEdit(p))return;let c=config[p], edit=Number.isInteger(i), x=edit?data[p][i]:[c.prefix+'-'+String(Date.now()).slice(-5),'','',''];modal(`<h2>${edit?'Ubah':'Tambah'} ${pages[p][0]}</h2><p>Ini adalah formulir simulasi; data hanya disimpan di browser.</p><form onsubmit="submitForm(event,'${p}',${edit?i:-1})">${c.labels.map((l,j)=>`<label for="f${j}">${l}</label><input id="f${j}" value="${esc(x[j])}" ${j===0?'readonly':''} ${p==='layanan'&&j===3?'type="number" min="0"':'type="text"'} required>`).join('')}<div class="actions"><button type="button" class="btn light" onclick="closeModal()">Batal</button><button class="btn">Simpan data</button></div></form>`)}function submitForm(e,p,i){e.preventDefault();if(!canEdit(p))return;let x=[0,1,2,3].map(j=>el('f'+j).value.trim());if(i<0)data[p].push(x);else data[p][i]=x;save();closeModal();render()}
function bookingDetail(i){let x=data.booking[i];modal(`<h2>Detail booking</h2><p>Informasi dan status layanan.</p>${details([['ID booking',x[0]],['Hewan',x[1]],['Owner',x[2]],['Layanan',x[3]],['Tanggal',x[4]],['Sesi',x[5]],['Status',x[6]],['Perkiraan biaya',money(x[7])]])}${x[6]!=='Selesai'?`<label for="newstatus">Ubah status demo</label><select id="newstatus">${['Menunggu','Dikonfirmasi','Dalam Proses','Dibatalkan'].map(s=>`<option ${s===x[6]?'selected':''}>${s}</option>`).join('')}</select>`:''}<div class="actions"><button class="btn light" onclick="closeModal()">Tutup</button>${x[6]!=='Selesai'?`<button class="btn" onclick="setStatus(${i})">Simpan status</button>`:''}</div>`)}function setStatus(i){data.booking[i][6]=el('newstatus').value;save();closeModal();render()}
function bookingForm(){if(!canEdit('booking'))return;modal(`<h2>Booking layanan baru</h2><p>Contoh input booking oleh admin atau kasir.</p><form onsubmit="addBooking(event)"><label>Hewan</label><select id="bh">${data.hewan.map((x,i)=>`<option value="${i}">${esc(x[1])} — ${esc(x[3])}</option>`).join('')}</select><label>Layanan</label><select id="bl">${data.layanan.map((x,i)=>`<option value="${i}">${esc(x[1])} — ${money(x[3])}</option>`).join('')}</select><label>Tanggal booking</label><input id="bd" type="date" required><label>Jam</label><input id="bt" type="time" required><div class="note">Ketersediaan fasilitas dan jadwal belum diperiksa pada demo.</div><div class="actions"><button type="button" class="btn light" onclick="closeModal()">Batal</button><button class="btn">Simpan booking</button></div></form>`)}function addBooking(e){e.preventDefault();let h=data.hewan[+el('bh').value],l=data.layanan[+el('bl').value];if(!h||!l)return;data.booking.unshift(['BKG-'+String(Date.now()).slice(-5),h[1],h[3],l[1],el('bd').value,el('bt').value,'Menunggu',l[3]]);save();closeModal();render()}
function checkout(i){let x=data.booking[i];modal(`<h2>Check-out pembayaran</h2><p>Simulasi pembayaran untuk booking ${esc(x[0])}.</p>${details([['Hewan',x[1]],['Owner',x[2]],['Layanan',x[3]],['Total tagihan',money(x[7])]])}<label>Metode pembayaran</label><select id="paymethod"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select><label>Jumlah dibayar</label><input type="number" id="paid" value="${esc(x[7])}" min="0"><p>Pembayaran ini hanya mengubah data contoh di browser.</p><div class="actions"><button class="btn light" onclick="closeModal()">Batal</button><button class="btn" onclick="pay(${i})">Proses pembayaran</button></div>`)}function pay(i){let x=data.booking[i],amount=Number(el('paid').value);if(amount<Number(x[7]))return alert('Jumlah pembayaran kurang.');let change=amount-Number(x[7]);data.nota.unshift(['NTA-'+String(Date.now()).slice(-5),x[1],x[2],x[3],new Date().toLocaleDateString('id-ID'),x[7],el('paymethod').value,el('role').value]);x[6]='Selesai';save();closeModal();alert('Pembayaran contoh berhasil. Kembalian: '+money(change));go('nota');notaDetail(0)}function notaDetail(i){let x=data.nota[i];modal(`<h2>Nota pembayaran</h2><p>Pawppy Jakarta · Bukti transaksi contoh</p>${details([['No. nota',x[0]],['Tanggal',x[4]],['Owner',x[2]],['Hewan',x[1]],['Layanan',x[3]],['Total',money(x[5])],['Metode',x[6]],['Kasir',x[7]]])}<p>Terima kasih sudah mempercayakan anabul Anda kepada Pawppy Jakarta.</p><div class="actions"><button class="btn light" onclick="closeModal()">Tutup</button><button class="btn" onclick="window.print()">Cetak nota</button></div>`)}function resetDemo(){if(confirm('Kembalikan semua data contoh seperti awal?')){data=JSON.parse(JSON.stringify(initial));save();go('dashboard')}}go('dashboard');
</script></body></html>
